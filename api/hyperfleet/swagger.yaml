host: hyperfleet-api.gcp-hcp.devshift.net
info:
  contact:
    name: GCP HCP Team
    url: https://github.com/openshift-online/gcp-hcp-ctl
  description: |-
    HyperFleet GCP API provides CRUD operations for managing OpenShift hosted control plane
    clusters on Google Cloud Platform.

    **Architecture**: Simple CRUD only, no business logic, no event creation.
    Sentinel operator handles all orchestration logic.
    Adapters handle the specifics of managing spec.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: HyperFleet GCP API
  version: 1.0.0
parameters:
  QueryParams.order:
    in: query
    name: order
    schema:
      $ref: '#/definitions/OrderDirection'
  QueryParams.orderBy:
    default: created_time
    in: query
    name: orderBy
    type: string
  QueryParams.page:
    default: 1
    format: int32
    in: query
    minimum: 1
    name: page
    type: integer
  QueryParams.pageSize:
    default: 20
    format: int32
    in: query
    minimum: 1
    name: pageSize
    type: integer
  SearchParams:
    description: |-
      Filter results using TSL (Tree Search Language) query syntax.
      Examples: `status.conditions.Reconciled='True'`, `name in ('c1','c2')`, `labels.region='us-east'`
    in: query
    name: search
    type: string
paths:
  /api/hyperfleet/v1/channels:
    get:
      description: Returns a paginated list of channels, optionally filtered by labels
        or TSL query.
      operationId: getChannels
      parameters:
      - $ref: '#/parameters/QueryParams.order'
      - $ref: '#/parameters/QueryParams.orderBy'
      - $ref: '#/parameters/QueryParams.page'
      - $ref: '#/parameters/QueryParams.pageSize'
      - $ref: '#/parameters/SearchParams'
      responses:
        "200":
          description: The request has succeeded.
          schema:
            $ref: '#/definitions/ChannelList'
        "400":
          description: The server could not understand the request due to invalid
            syntax.
        default:
          description: An unexpected error response.
      security:
      - BearerAuth: []
      summary: List channels
      tags:
      - Channels
    post:
      consumes:
      - application/json
      description: Creates a new channel.
      operationId: postChannel
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ChannelCreateRequest'
      responses:
        "201":
          description: The request has succeeded and a new resource has been created
            as a result.
          schema:
            $ref: '#/definitions/Channel'
        "400":
          description: The server could not understand the request due to invalid
            syntax.
        default:
          description: An unexpected error response.
      security:
      - BearerAuth: []
      summary: Create channel
      tags:
      - Channels
  /api/hyperfleet/v1/channels/{channel_id}:
    delete:
      description: Marks the channel for deletion. Returns 409 if versions still exist
        (RESTRICT policy).
      operationId: deleteChannelById
      parameters:
      - in: path
        name: channel_id
        required: true
        type: string
      responses:
        "202":
          description: The request has been accepted for processing, but processing
            has not yet completed.
          schema:
            $ref: '#/definitions/Channel'
        "400":
          description: The server could not understand the request due to invalid
            syntax.
        "404":
          description: The server cannot find the requested resource.
        "409":
          description: The request conflicts with the current state of the server.
        default:
          description: An unexpected error response.
      security:
      - BearerAuth: []
      summary: Request channel deletion
      tags:
      - Channels
    get:
      description: Returns a single channel by its ID.
      operationId: getChannelById
      parameters:
      - $ref: '#/parameters/SearchParams'
      - in: path
        name: channel_id
        required: true
        type: string
      responses:
        "200":
          description: The request has succeeded.
          schema:
