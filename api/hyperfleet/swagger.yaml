definitions:
  AdapterCondition:
    description: |-
      Condition in AdapterStatus
      Used for standard Kubernetes condition types: "Available", "Applied", "Health", "Finalized"
      Note: observed_generation is at AdapterStatus level, not per-condition,
      since all conditions in one AdapterStatus share the same observed generation
    properties:
      last_transition_time:
        description: |-
          When this condition last transitioned status (API-managed)
          Only updated when status changes (True/False), not when reason/message changes
        format: date-time
        type: string
      message:
        description: Human-readable message
        type: string
      reason:
        description: Machine-readable reason code
        type: string
      status:
        $ref: '#/definitions/AdapterConditionStatus'
      type:
        description: Condition type
        type: string
    required:
    - type
    - last_transition_time
    - status
    type: object
  AdapterConditionStatus:
    description: Status value for adapter conditions
    enum:
    - "True"
    - "False"
    - Unknown
    type: string
  AdapterStatus:
    description: |-
      AdapterStatus represents the complete status report from an adapter
      Contains multiple conditions, job metadata, and adapter-specific data
    example:
      adapter: adapter1
      conditions:
      - last_transition_time: "2021-01-01T10:00:00Z"
        message: This adapter1 is available
        reason: This adapter1 is available
        status: "True"
        type: Available
      - last_transition_time: "2021-01-01T10:00:00Z"
        message: Adapter1 validation job applied successfully
        reason: Validation job applied
        status: "True"
        type: Applied
      - last_transition_time: "2021-01-01T10:00:00Z"
        message: All adapter1 runtime operations completed successfully
        reason: All adapter1 operations completed successfully
        status: "True"
        type: Health
      - last_transition_time: "2021-01-01T10:00:00Z"
        message: All resources deleted; cleanup confirmed
        reason: All resources deleted; cleanup confirmed
        status: "True"
        type: Finalized
      created_time: "2021-01-01T10:00:00Z"
      data:
        validation_results:
          failed: 0
          passed: 30
          total_tests: 30
      last_report_time: "2021-01-01T10:02:00Z"
      metadata:
        attempt: 1
        completed_time: "2021-01-01T10:02:00Z"
        duration: 2m
        job_name: validator-job-abc123
        job_namespace: hyperfleet-system
        started_time: "2021-01-01T10:00:00Z"
      observed_generation: 1
    properties:
      adapter:
        description: Adapter name (e.g., "validator", "dns", "provisioner")
        type: string
      conditions:
        description: |-
          Kubernetes-style conditions tracking adapter state
          Typically includes: Available, Applied, Health, Finalized
        items:
          $ref: '#/definitions/AdapterCondition'
        type: array
      created_time:
        description: When this adapter status was first created (API-managed)
        format: date-time
        type: string
      data:
        additionalProperties: {}
        description: Adapter-specific data (structure varies by adapter type)
        type: object
      last_report_time:
        description: |-
          When this adapter last reported its status (API-managed)
          Updated every time the adapter PUTs, even if conditions haven't changed
          Used by Sentinel to detect adapter liveness
        format: date-time
        type: string
      metadata:
        description: Job execution metadata
        properties:
          attempt:
            format: int32
            type: integer
          completed_time:
            format: date-time
            type: string
          duration:
            type: string
          job_name:
            type: string
          job_namespace:
            type: string
          started_time:
            format: date-time
            type: string
        type: object
      observed_generation:
        description: Which generation of the resource this status reflects
        format: int32
        type: integer
    required:
    - adapter
    - observed_generation
    - conditions
    - created_time
    - last_report_time
    type: object
  AdapterStatusList:
    description: List of adapter statuses with pagination metadata
    example:
      items:
      - adapter: adapter1
        conditions:
        - last_transition_time: "2021-01-01T10:00:00Z"
          message: This adapter1 is available
          reason: This adapter1 is available
          status: "True"
          type: Available
        created_time: "2021-01-01T10:00:00Z"
        last_report_time: "2021-01-01T10:02:00Z"
        metadata:
          duration: 2m
          job_name: validator-job-abc123
        observed_generation: 1
      - adapter: adapter2
        conditions:
        - last_transition_time: "2021-01-01T10:01:00Z"
          message: This adapter2 is available
          reason: This adapter2 is available
          status: "True"
          type: Available
        created_time: "2021-01-01T10:01:00Z"
        last_report_time: "2021-01-01T10:01:30Z"
        observed_generation: 1
      page: 1
      size: 2
      total: 2
    properties:
      items:
        items:
          $ref: '#/definitions/AdapterStatus'
        type: array
      page:
        format: int32
        type: integer
      size:
        format: int32
        type: integer
      total:
        format: int32
        type: integer
    required:
    - page
    - size
    - total
    - items
    type: object
  BadRequestDetails:
    allOf:
    - $ref: '#/definitions/ProblemDetails'
    example:
      code: HYPERFLEET-VAL-001
      detail: The cluster name field is required
      instance: /api/hyperfleet/v1/clusters
      status: 400
      timestamp: "2024-01-15T10:30:00Z"
      title: Validation Failed
      trace_id: aabbccddeeff0011
      type: https://api.hyperfleet.io/errors/validation-error
    type: object
  Channel:
    example:
      created_by: user-123@example.com
      created_time: "2025-06-01T00:00:00Z"
      generation: 1
      href: /api/hyperfleet/v1/channels/019466a2-1234-7abc-9def-0123456789ab
      id: 019466a2-1234-7abc-9def-0123456789ab
      kind: Channel
      labels:
        tier: production
      name: stable
      spec:
        enabled_regex: ^4\.\d+\.\d+$
        is_default: true
      status:
        conditions: []
      updated_by: user-123@example.com
      updated_time: "2025-06-01T10:02:00Z"
    properties:
      created_by:
        description: Identity that created the resource
        format: email
        type: string
      created_time:
        description: Timestamp when the resource was created
        format: date-time
        type: string
      deleted_by:
        description: Identity that requested deletion; omitted if not marked for deletion
        format: email
        type: string
      deleted_time:
        description: Timestamp when deletion was requested; omitted if not marked
          for deletion
        format: date-time
        type: string
      generation:
        format: int32
        minimum: 1
        type: integer
      href:
        description: Resource URI
        type: string
      id:
        description: Resource identifier
        type: string
      kind:
        description: Resource kind
        type: string
      labels:
        additionalProperties:
          type: string
        description: labels for the API resource as pairs of name:value strings
        type: object
      name:
        maxLength: 63
        minLength: 1
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        type: string
      spec:
        $ref: '#/definitions/ChannelSpec'
      status:
        $ref: '#/definitions/ResourceStatus'
      updated_by:
        description: Identity that last updated the resource
        format: email
        type: string
      updated_time:
        description: Timestamp when the resource was last updated
        format: date-time
        type: string
    required:
    - name
    - spec
    - created_time
    - updated_time
    - created_by
    - updated_by
    - generation
    - status
    type: object
  ChannelCreateRequest:
    example:
      kind: Channel
      labels:
        tier: production
      name: stable
      spec:
        enabled_regex: ^4\.\d+\.\d+$
        is_default: true
    properties:
      href:
        description: Resource URI
        type: string
      id:
        description: Resource identifier
        type: string
      kind:
        description: Resource kind
        type: string
      labels:
        additionalProperties:
          type: string
        description: labels for the API resource as pairs of name:value strings
        type: object
      name:
        maxLength: 63
        minLength: 1
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        type: string
      spec:
        $ref: '#/definitions/ChannelSpec'
    required:
    - name
    - spec
    type: object
  ChannelList:
    properties:
      items:
        items:
          $ref: '#/definitions/Channel'
        type: array
      page:
        format: int32
        type: integer
      size:
        format: int32
        type: integer
      total:
        format: int32
        type: integer
    required:
    - page
    - size
    - total
    - items
    type: object
  ChannelPatchRequest:
    additionalProperties: false
    example:
      labels:
        tier: staging
      spec:
        enabled_regex: ^4\.17\.\d+$
        is_default: false
    minProperties: 1
    properties:
      labels:
        additionalProperties:
          type: string
        type: object
      spec:
        $ref: '#/definitions/ChannelSpec'
    type: object
  ChannelSpec:
    properties:
      enabled_regex:
        description: Regex pattern for matching enabled version strings
        type: string
      is_default:
        description: Whether this is the default channel for new clusters
        type: boolean
    required:
    - is_default
    - enabled_regex
    type: object
  Cluster:
    example:
      created_by: user@redhat.com
      created_time: "2021-01-01T00:00:00Z"
      generation: 1
      href: https://api.hyperfleet.com/v1/clusters/019466a0-8f8e-7abc-9def-0123456789ab
      id: 019466a0-8f8e-7abc-9def-0123456789ab
      kind: Cluster
      labels:
        env: dev
        shard: "1"
      name: my-gcp-cluster
      spec:
        infraID: my-gcp-cluster
        issuerURL: https://oidc.dev-reg-us-c1-abc123.dev.gcp-hcp.devshift.net/my-gcp-cluster
        platform:
          gcp:
            endpointAccess: PublicAndPrivate
            network: dev-mgt-us-c1-vpc
            projectID: my-gcp-project-123
            region: us-central1
            subnet: dev-mgt-us-c1-psc-001
            workloadIdentity:
              poolID: my-gcp-cluster-pool
              projectNumber: "123456789012"
              providerID: my-gcp-cluster-provider
              serviceAccountsRef:
                cloudControllerEmail: my-gcp-cluster-cloud-ctrl@my-gcp-project-123.iam.gserviceaccount.com
                controlPlaneEmail: my-gcp-cluster-ctrlplane@my-gcp-project-123.iam.gserviceaccount.com
                imageRegistryEmail: my-gcp-cluster-img-reg@my-gcp-project-123.iam.gserviceaccount.com
                networkEmail: my-gcp-cluster-cloud-net@my-gcp-project-123.iam.gserviceaccount.com
                nodePoolEmail: my-gcp-cluster-nodepool@my-gcp-project-123.iam.gserviceaccount.com
                storageEmail: my-gcp-cluster-gcp-pd-csi@my-gcp-project-123.iam.gserviceaccount.com
          type: gcp
        release:
          channelGroup: candidate
          version: 4.18.0
      status:
        conditions:
        - created_time: "2021-01-01T10:00:00Z"
          last_transition_time: "2021-01-01T10:00:00Z"
          last_updated_time: "2021-01-01T10:00:00Z"
          message: All required adapters reported Available=True or Finalized=True
            at the current generation
          observed_generation: 1
          reason: ReconciledAll
          status: "True"
          type: Reconciled
        - created_time: "2021-01-01T10:00:00Z"
          last_transition_time: "2021-01-01T10:00:00Z"
          last_updated_time: "2021-01-01T10:00:00Z"
          message: All required adapters report Available=True for the tracked generation
          observed_generation: 1
          reason: AllAdaptersReconciled
          status: "True"
          type: LastKnownReconciled
        - created_time: "2021-01-01T10:00:00Z"
          last_transition_time: "2021-01-01T10:00:00Z"
          last_updated_time: "2021-01-01T10:00:00Z"
          message: This adapter1 is available
          observed_generation: 1
          reason: This adapter1 is available
          status: "True"
          type: PlacementSuccessful
        - created_time: "2021-01-01T10:01:00Z"
          last_transition_time: "2021-01-01T10:01:00Z"
          last_updated_time: "2021-01-01T10:01:00Z"
          message: This adapter2 is available
          observed_generation: 1
          reason: This adapter2 is available
          status: "True"
          type: HostedClusterSuccessful
      updated_by: user@redhat.com
      updated_time: "2021-01-01T10:02:00Z"
    properties:
      created_by:
        description: Identity that created the resource
        format: email
        type: string
      created_time:
        description: Timestamp when the resource was created
        format: date-time
        type: string
      deleted_by:
        description: Identity that requested deletion; omitted if not marked for deletion
        format: email
        type: string
      deleted_time:
        description: Timestamp when deletion was requested; omitted if not marked
          for deletion
        format: date-time
        type: string
      generation:
        description: Generation field is updated on customer updates, reflecting the
          version of the "intent" of the customer
        format: int32
        minimum: 1
        type: integer
      href:
        description: Resource URI
        type: string
      id:
        description: Resource identifier
        type: string
      kind:
        description: Resource kind
        type: string
      labels:
        additionalProperties:
          type: string
        description: labels for the API resource as pairs of name:value strings
        type: object
      name:
        description: Cluster name (unique)
        maxLength: 53
        minLength: 3
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        type: string
      spec:
        $ref: '#/definitions/ClusterSpec'
      status:
        $ref: '#/definitions/ClusterStatus'
      updated_by:
        description: Identity that last updated the resource
        format: email
        type: string
      updated_time:
        description: Timestamp when the resource was last updated
        format: date-time
        type: string
    required:
    - name
    - spec
    - created_time
    - updated_time
    - created_by
    - updated_by
    - generation
    - status
    type: object
  ClusterCreateRequest:
    example:
      kind: Cluster
      labels:
        env: dev
        shard: "1"
      name: my-gcp-cluster
      spec:
        infraID: my-gcp-cluster
        issuerURL: https://oidc.dev-reg-us-c1-abc123.dev.gcp-hcp.devshift.net/my-gcp-cluster
        platform:
          gcp:
            endpointAccess: PublicAndPrivate
            network: dev-mgt-us-c1-vpc
            projectID: my-gcp-project-123
            region: us-central1
            subnet: dev-mgt-us-c1-psc-001
            workloadIdentity:
              poolID: my-gcp-cluster-pool
              projectNumber: "123456789012"
              providerID: my-gcp-cluster-provider
              serviceAccountsRef:
                cloudControllerEmail: my-gcp-cluster-cloud-ctrl@my-gcp-project-123.iam.gserviceaccount.com
                controlPlaneEmail: my-gcp-cluster-ctrlplane@my-gcp-project-123.iam.gserviceaccount.com
                imageRegistryEmail: my-gcp-cluster-img-reg@my-gcp-project-123.iam.gserviceaccount.com
                networkEmail: my-gcp-cluster-cloud-net@my-gcp-project-123.iam.gserviceaccount.com
                nodePoolEmail: my-gcp-cluster-nodepool@my-gcp-project-123.iam.gserviceaccount.com
                storageEmail: my-gcp-cluster-gcp-pd-csi@my-gcp-project-123.iam.gserviceaccount.com
          type: gcp
        release:
          channelGroup: candidate
          version: 4.18.0
    properties:
      href:
        description: Resource URI
        type: string
      id:
        description: Resource identifier
        type: string
      kind:
        description: Resource kind
        type: string
      labels:
        additionalProperties:
          type: string
        description: labels for the API resource as pairs of name:value strings
        type: object
      name:
        description: Cluster name (unique)
        maxLength: 53
        minLength: 3
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        type: string
      spec:
        $ref: '#/definitions/ClusterSpec'
    required:
    - name
    - spec
    type: object
  ClusterList:
    properties:
      items:
        items:
          $ref: '#/definitions/Cluster'
        type: array
      page:
        format: int32
        type: integer
      size:
        format: int32
        type: integer
      total:
        format: int32
        type: integer
    required:
    - page
    - size
    - total
    - items
    type: object
  ClusterNetworkEntry:
    properties:
      cidr:
        type: string
      hostPrefix:
        type: integer
    type: object
  ClusterPatchRequest:
    additionalProperties: false
    example:
      labels:
        env: staging
      spec:
        platform:
          gcp:
            network: dev-mgt-us-c1-vpc
            projectID: my-gcp-project-123
            region: us-central1
            subnet: dev-mgt-us-c1-psc-001
          type: gcp
        release:
          channelGroup: stable
          version: 4.18.1
    minProperties: 1
    properties:
      labels:
        additionalProperties:
          type: string
        type: object
      spec:
        $ref: '#/definitions/ClusterSpec'
    type: object
  ClusterPlatformSpec:
    properties:
      gcp:
        $ref: '#/definitions/GCPClusterPlatform'
      type:
        enum:
        - gcp
        type: string
    required:
    - type
    - gcp
    type: object
  ClusterSpec:
    properties:
      dns:
        $ref: '#/definitions/DNSSpec'
      infraID:
        type: string
      issuerURL:
        type: string
      networking:
        $ref: '#/definitions/NetworkingSpec'
      platform:
        $ref: '#/definitions/ClusterPlatformSpec'
      release:
        $ref: '#/definitions/ReleaseSpec'
    required:
    - platform
    type: object
  ClusterStatus:
    description: |-
      Cluster status computed from all status conditions.

      This object is computed by the service and CANNOT be modified directly.
      It is aggregated from condition updates posted to `/clusters/{id}/statuses`.

      Provides quick overview of all reported conditions.
    properties:
      conditions:
        description: |-
          List of status conditions for the cluster.

          **Mandatory conditions**:
          - `type: "Reconciled"`: Whether the resource's desired state has been fully reconciled by all adapters at the current generation.
          - `type: "LastKnownReconciled"`: Sticky cross-generation condition — stays True as long as all required adapters were reconciled at a common observed generation, even if a newer generation is being processed.

          These conditions are present immediately upon resource creation.
        items:
          $ref: '#/definitions/ResourceCondition'
        minItems: 2
        type: array
    required:
    - conditions
    type: object
  ConflictDetails:
    allOf:
    - $ref: '#/definitions/ProblemDetails'
    example:
      code: HYPERFLEET-CNF-001
      detail: This Cluster already exists
      instance: /api/hyperfleet/v1/clusters
      status: 409
      timestamp: "2024-01-15T10:30:00Z"
      title: Resource Conflict
      trace_id: cafe0011aabb9988
      type: https://api.hyperfleet.io/errors/resource-conflict
    type: object
  DNSSpec:
    properties:
      baseDomain:
        type: string
    type: object
  ForbiddenDetails:
    allOf:
    - $ref: '#/definitions/ProblemDetails'
    example:
      code: HYPERFLEET-AUZ-001
      detail: You do not have permission to perform this action
      instance: /api/hyperfleet/v1/clusters
      status: 403
      timestamp: "2024-01-15T10:30:00Z"
      title: Permission Denied
      trace_id: 99aabbcc11223344
      type: https://api.hyperfleet.io/errors/permission-denied
    type: object
  ForbiddenResponse:
    description: The client does not have permission to perform this action.
    properties:
      body:
        $ref: '#/definitions/ForbiddenDetails'
    required:
    - body
    type: object
  GCPClusterPlatform:
    properties:
      endpointAccess:
        enum:
        - Private
        - PublicAndPrivate
        type: string
      network:
        type: string
      projectID:
        type: string
      region:
        type: string
      subnet:
        type: string
      workloadIdentity:
        $ref: '#/definitions/GCPWorkloadIdentity'
    required:
    - projectID
    - region
    type: object
  GCPNodePoolPlatform:
    properties:
      instanceType:
        description: GCE machine type (e.g. n2-standard-4). Maps to HyperShift NodePool
          machineType.
        type: string
      rootVolume:
        allOf:
        - $ref: '#/definitions/GCPRootVolume'
        description: Boot disk configuration. Maps to HyperShift NodePool bootDisk.
      zone:
        description: GCP zone for node placement (e.g. us-central1-a). Falls back
          to cluster region + "-a" if not set.
        type: string
    type: object
  GCPRootVolume:
    properties:
      size:
        description: Boot disk size in GB. Maps to HyperShift bootDisk.diskSizeGB.
        minimum: 10
        type: integer
      type:
        description: Boot disk type. Maps to HyperShift bootDisk.diskType.
        enum:
        - pd-standard
        - pd-ssd
        - pd-balanced
        type: string
    type: object
  GCPServiceAccountsRef:
    properties:
      cloudControllerEmail:
        type: string
      controlPlaneEmail:
        type: string
      imageRegistryEmail:
        type: string
      networkEmail:
        type: string
      nodePoolEmail:
        type: string
      storageEmail:
        type: string
    type: object
  GCPWorkloadIdentity:
    properties:
      poolID:
        type: string
      projectNumber:
        type: string
      providerID:
        type: string
      serviceAccountsRef:
        $ref: '#/definitions/GCPServiceAccountsRef'
    required:
    - projectNumber
    - poolID
    - providerID
    type: object
  NetworkingSpec:
    properties:
      clusterNetwork:
        items:
          $ref: '#/definitions/ClusterNetworkEntry'
        type: array
      serviceNetwork:
        items:
          type: string
        type: array
    type: object
  NodePool:
    example:
      created_by: user@redhat.com
      created_time: "2021-01-01T00:00:00Z"
      generation: 1
      href: https://api.hyperfleet.com/v1/nodepools/019466a1-2b3c-7def-8abc-456789abcdef
      id: 019466a1-2b3c-7def-8abc-456789abcdef
      kind: NodePool
      labels:
        environment: production
        pooltype: worker
      name: worker-pool-1
      owner_references:
        href: https://api.hyperfleet.com/v1/clusters/019466a0-8f8e-7abc-9def-0123456789ab
        id: 019466a0-8f8e-7abc-9def-0123456789ab
        kind: Cluster
      spec:
        platform:
          gcp:
            instanceType: n2-standard-4
            rootVolume:
              size: 100
              type: pd-balanced
            zone: us-central1-a
          type: gcp
        release:
          channelGroup: candidate
          version: 4.18.0
        replicas: 2
      status:
        conditions:
        - created_time: "2021-01-01T10:00:00Z"
          last_transition_time: "2021-01-01T10:00:00Z"
          last_updated_time: "2021-01-01T10:00:00Z"
          message: All required adapters reported Available=True or Finalized=True
            at the current generation
          observed_generation: 1
          reason: ReconciledAll
          status: "True"
          type: Reconciled
        - created_time: "2021-01-01T10:00:00Z"
          last_transition_time: "2021-01-01T10:00:00Z"
          last_updated_time: "2021-01-01T10:00:00Z"
          message: All required adapters report Available=True for the tracked generation
          observed_generation: 1
          reason: AllAdaptersReconciled
          status: "True"
          type: LastKnownReconciled
        - created_time: "2021-01-01T10:00:00Z"
          last_transition_time: "2021-01-01T10:00:00Z"
          last_updated_time: "2021-01-01T10:00:00Z"
          message: Version 4.18.0 resolved to release image via Cincinnati channel
            candidate-4.18
          observed_generation: 1
          reason: ReleaseImageAvailable
          status: "True"
          type: VersionResolved
        - created_time: "2021-01-01T10:01:00Z"
          last_transition_time: "2021-01-01T10:01:00Z"
          last_updated_time: "2021-01-01T10:01:00Z"
          message: NodePool ManifestWork applied to management cluster
          observed_generation: 1
          reason: ManifestWorkApplied
